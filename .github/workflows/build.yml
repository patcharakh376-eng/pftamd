name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - run: unzip -o pftame-addon-source.zip
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 6.9.4
      - run: gradle build
        working-directory: pftame-addon
      - uses: actions/upload-artifact@v4
        with:
          name: pftame-jar
          path: pftame-addon/build/libs/*.jar
